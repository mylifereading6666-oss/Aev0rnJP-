<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><meta name="description" content="インストール不要・オフライン対応の無料ルーレット"><link rel="manifest" href="./manifest.json"><title>Aev0rnJP Roulette</title><style>
:root{color-scheme:dark;--bg:#10111b;--panel:#1a1c2b;--line:#303349;--muted:#a8acc4;--text:#f6f7ff;--accent:#9d8cff;--accent2:#57e0c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29234d 0,#10111b 52%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--text);background:#25273a}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#8c78ff,#6550d9);border:0;font-weight:750}button.ghost{background:transparent}button.danger{color:#ff9eac}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1060px;margin:auto;padding:18px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#a18dff,#4fe2c1);display:grid;place-items:center;color:#111326;font-size:24px;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.pill{border:1px solid #454066;color:#c9c0ff;border-radius:99px;padding:6px 10px;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);gap:16px}.panel{background:rgba(26,28,43,.94);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 14px 35px #0002}.wheel-panel{text-align:center;display:flex;flex-direction:column;align-items:center}.wheel-wrap{width:min(100%,420px);position:relative;margin:8px auto 16px}.pointer{position:absolute;z-index:2;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:27px solid #fff;filter:drop-shadow(0 2px 3px #0008)}canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px #0005)}.spin{width:min(100%,320px);padding:15px;font-size:18px;border-radius:15px}.subline{font-size:13px;color:var(--muted);margin:10px 0 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.section-title h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}.add-row{display:flex;gap:8px;margin-bottom:10px}.add-row input{min-width:0;flex:1}.field,input,select{background:#111321;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 12px;outline:none;width:100%}input:focus,select:focus{border-color:var(--accent)}.list{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow:auto}.item{display:flex;align-items:center;gap:9px;padding:9px 10px;background:#141625;border:1px solid #292c40;border-radius:12px}.dot{width:12px;height:12px;border-radius:50%;flex:none}.item-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.item-actions{display:flex;gap:4px}.icon-btn{padding:5px 8px;border-radius:8px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.toolbar button{font-size:12px;padding:8px 10px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.settings label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important}.check input{width:auto}.history{margin-top:16px}.history-list{display:flex;flex-direction:column;gap:7px}.history-entry{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#141625;border-radius:10px;font-size:13px}.history-entry span:nth-child(2){flex:1;overflow-wrap:anywhere}.history-entry small{color:var(--muted)}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#070811cc;z-index:5;padding:18px}.modal.show{display:flex}.modal-card{width:min(100%,440px);background:#202237;border:1px solid #494568;border-radius:22px;padding:26px;text-align:center;box-shadow:0 25px 90px #0009}.modal-card .eyebrow{color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:.12em}.modal-card h2{font-size:28px;overflow-wrap:anywhere;margin:12px 0 20px}.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.foot{text-align:center;color:#7f829e;font-size:11px;margin-top:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.app{padding:14px 11px 30px}.panel{padding:15px}.wheel-wrap{width:min(100%,360px)}.brand h1{font-size:16px}.settings{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">A</div><div><h1>Aev0rnJP Roulette</h1><p>迷ったときに、回して決めよう。</p></div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end"><span class="pill">● オフライン対応</span><a href="./support.html" style="display:inline-block;text-decoration:none;border:1px solid #454066;color:#c9c0ff;border-radius:99px;padding:7px 11px;font-size:12px;white-space:nowrap">💜 サポート</a></div></header><div class="layout"><section class="panel wheel-panel"><div class="section-title" style="width:100%"><h2>ルーレット</h2><span id="wheelCount" class="count">0項目</span></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="700" height="700" aria-label="抽選ルーレット"></canvas></div><button id="spinBtn" class="primary spin">✦　ルーレットを回す</button><p class="subline" id="wheelHint">候補を2つ以上追加してください</p></section><section class="panel"><div class="section-title"><h2>候補リスト</h2><span id="count" class="count">0項目</span></div><form id="addForm" class="add-row"><input id="newItem" maxlength="80" placeholder="候補を入力…" aria-label="候補を入力"><button class="primary" type="submit">追加</button></form><div id="items" class="list"></div><div class="toolbar"><button id="shuffle">🔀 シャッフル</button><button id="sort">↕ 名前順</button><button id="sample">サンプル</button><button id="clear" class="danger">全削除</button></div><div class="settings"><label>回転時間<select id="duration"><option value="3">3秒</option><option value="5" selected>5秒</option><option value="8">8秒</option><option value="12">12秒</option></select></label><label>抽選後<select id="after"><option value="keep">候補を残す</option><option value="remove">当選者を削除</option></select></label><label class="check"><input id="sound" type="checkbox" checked> 効果音</label><label class="check"><input id="weighted" type="checkbox"> 重み付けモード</label></div><div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><div class="section-title"><h2>コマンド入力</h2><span class="count">設定を保存</span></div><form id="commandForm" class="add-row"><input id="commandInput" maxlength="200" autocomplete="off" placeholder="/help と入力" aria-label="コマンド入力"><button class="primary" type="submit">実行</button></form><div id="commandOutput" role="status" style="font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere">/help でコマンド一覧を表示</div></div><div class="history"><div class="section-title"><h2>抽選履歴</h2><button id="clearHistory" class="ghost icon-btn">履歴削除</button></div><div id="history" class="history-list"></div></div><div class="toolbar"><button id="export">バックアップ保存</button><button id="importBtn">バックアップ読込</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div></section></div><div class="foot">データはこの端末のブラウザ内に保存されます。サーバーへの送信はありません。<br><a href="./support.html" style="display:inline-block;margin-top:10px;color:#c9c0ff;text-decoration:none;border:1px solid #454066;border-radius:99px;padding:7px 12px">💜 Aev0rnJPをサポート</a></div></main><div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="modal-card"><div class="eyebrow">★ RESULT ★</div><h2 id="resultTitle">結果</h2><div class="modal-actions"><button id="closeResult" class="primary">OK</button><button id="spinAgain">もう一度回す</button></div></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),colors=['#8d7bff','#48d9c0','#ffb86b','#ff7893','#70b8ff','#d28cff','#f4df68','#55c9df','#ff9dce','#a8e07c'];let items=[],history=[],rotation=0,spinning=false,audioCtx=null;try{items=JSON.parse(localStorage.getItem('aev-roulette-items')||'[]');history=JSON.parse(localStorage.getItem('aev-roulette-history')||'[]');if(!Array.isArray(items))items=[];if(!Array.isArray(history))history=[]}catch{items=[];history=[]}if(!items.length)items=['候補 A','候補 B','候補 C','候補 D'].map(name=>({name,weight:1}));items=items.map(x=>typeof x==='string'?{name:x,weight:1}:x);const save=()=>{try{localStorage.setItem('aev-roulette-items',JSON.stringify(items));localStorage.setItem('aev-roulette-history',JSON.stringify(history.slice(0,30)))}catch{}};const color=i=>colors[i%colors.length];
function draw(){const c=$('wheel'),ctx=c.getContext('2d'),w=c.width,cx=w/2,cy=w/2,r=w*.455;ctx.clearRect(0,0,w,w);ctx.save();ctx.translate(cx,cy);if(!items.length){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle='#292b40';ctx.fill();ctx.fillStyle='#a8acc4';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('候補を追加',0,8);ctx.restore();return}const weight=x=>$('weighted').checked?Math.max(1,Math.min(100,Number(x.weight)||1)):1,total=items.reduce((s,x)=>s+weight(x),0);let start=rotation-Math.PI/2;items.forEach((it,i)=>{const end=start+Math.PI*2*weight(it)/total;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=color(i);ctx.fill();ctx.strokeStyle='#171827';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate((start+end)/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#111321';ctx.font='bold '+(items.length>12?'17':'21')+'px system-ui';let label=it.name;while(ctx.measureText(label).width>r*.69&&label.length>2)label=label.slice(0,-1);if(label!==it.name)label+='…';ctx.fillText(label,r-20,0);ctx.restore();start=end});ctx.beginPath();ctx.arc(0,0,37,0,Math.PI*2);ctx.fillStyle='#f5f3ff';ctx.fill();ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fillStyle='#7764e8';ctx.fill();ctx.restore()}
function render(){const box=$('items');box.innerHTML='';items.forEach((it,i)=>{const row=document.createElement('div');row.className='item';const dot=document.createElement('span');dot.className='dot';dot.style.background=color(i);const name=document.createElement('span');name.className='item-name';name.textContent=it.name;const actions=document.createElement('div');actions.className='item-actions';const edit=document.createElement('button');edit.className='icon-btn';edit.textContent='編集';edit.onclick=()=>{const v=prompt('候補名を編集',it.name);if(v&&v.trim()){items[i].name=v.trim().slice(0,80);save();render()}};const del=document.createElement('button');del.className='icon-btn danger';del.textContent='✕';del.setAttribute('aria-label',it.name+'を削除');del.onclick=()=>{items.splice(i,1);save();render()};actions.append(edit,del);row.append(dot,name,actions);box.append(row)});$('count').textContent=items.length+'項目';$('wheelCount').textContent=items.length+'項目';$('spinBtn').disabled=spinning||items.length<2;$('wheelHint').textContent=items.length<2?'候補を2つ以上追加してください':spinning?'抽選中…':'ボタンを押して抽選';renderHistory();draw()}
function renderHistory(){const el=$('history');el.innerHTML='';if(!history.length){el.innerHTML='<div class="empty">まだ抽選履歴はありません</div>';return}history.slice(0,10).forEach(h=>{const row=document.createElement('div');row.className='history-entry';const d=document.createElement('span');d.className='dot';d.style.background=color(0);const n=document.createElement('span');n.textContent=h.name;const t=document.createElement('small');t.textContent=h.time;row.append(d,n,t);el.append(row)})}
$('addForm').addEventListener('submit',e=>{e.preventDefault();const v=$('newItem').value.trim();if(!v)return;if(items.length>=100){alert('候補は最大100個です');return}items.push({name:v.slice(0,80),weight:1});$('newItem').value='';save();render();$('newItem').focus()});$('shuffle').onclick=()=>{for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}save();render()};$('sort').onclick=()=>{items.sort((a,b)=>a.name.localeCompare(b.name,'ja'));save();render()};$('sample').onclick=()=>{items=['はい','いいえ','保留'].map(name=>({name,weight:1}));save();render()};$('clear').onclick=()=>{if(confirm('候補をすべて削除しますか？')){items=[];save();render()}};$('clearHistory').onclick=()=>{history=[];save();renderHistory()};$('weighted').onchange=()=>{try{localStorage.setItem('aev-roulette-weighted',$('weighted').checked?'1':'0')}catch{}draw()};try{$('weighted').checked=localStorage.getItem('aev-roulette-weighted')==='1'}catch{}
$('commandForm').addEventListener('submit',e=>{e.preventDefault();const raw=$('commandInput').value.trim();if(!raw)return;const m=raw.match(/^\/weight\s+(.+?)\s+(\d+)$/i);const cmd=raw.toLowerCase();const say=t=>$('commandOutput').textContent=t;if(cmd==='/help'||cmd==='help'){say('コマンド一覧\n/weight "候補名" 1〜100 — 候補の重みを設定\n/weights on — 重み付け抽選を有効化\n/weights off — 均等確率にする（設定値は保持）\n/weights list — 重み一覧\n/weights reset — 全候補の重みを1に戻す');}
else if(m){const name=m[1].replace(/^"|"$/g,'').trim(),n=Number(m[2]),it=items.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!it)say('候補が見つかりません。候補名を確認してください。');else if(n<1||n>100)say('重みは1〜100で指定してください。');else{it.weight=n;$('weighted').checked=true;try{localStorage.setItem('aev-roulette-weighted','1')}catch{}save();render();say('保存済み：'+it.name+' の重みを '+n+' に設定しました。重み付け抽選は有効です。');}}
else if(cmd==='/weights on'){$('weighted').checked=true;try{localStorage.setItem('aev-roulette-weighted','1')}catch{}draw();say('重み付け抽選を有効化しました。設定はこの端末に保存されます。');}
else if(cmd==='/weights off'){$('weighted').checked=false;try{localStorage.setItem('aev-roulette-weighted','0')}catch{}draw();say('均等確率に切り替えました。各候補の重み設定は保持されています。');}
else if(cmd==='/weights list')say(items.map(x=>x.name+' : '+Math.max(1,Math.min(100,Number(x.weight)||1))).join('\n')||'候補がありません。');
else if(cmd==='/weights reset'){items.forEach(x=>x.weight=1);save();render();say('すべての重みを1に戻しました。');}
else say('コマンドが不明です。/help を入力してください。');$('commandInput').value='';});
function beep(freq=600,d=.045){if(!$('sound').checked)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
function spin(){if(spinning||items.length<2)return;spinning=true;$('spinBtn').disabled=true;const dur=Number($('duration').value)*1000,startRot=rotation,weight=x=>$('weighted').checked?Math.max(1,Math.min(100,Number(x.weight)||1)):1,total=items.reduce((s,x)=>s+weight(x),0);let r=Math.random()*total,targetIndex=items.findIndex(x=>(r-=weight(x))<0);if(targetIndex<0)targetIndex=items.length-1;let cumulative=0;for(let i=0;i<targetIndex;i++)cumulative+=Math.PI*2*weight(items[i])/total;const segment=Math.PI*2*weight(items[targetIndex])/total,targetAngle=-(cumulative+segment/2),norm=a=>((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2),desired=norm(targetAngle),current=norm(startRot),delta=norm(desired-current)+Math.PI*2*(5+Math.floor(Math.random()*3)),endRot=startRot+delta,begin=performance.now();let lastTick=-1;function frame(now){const p=Math.min(1,(now-begin)/dur),ease=1-Math.pow(1-p,4);rotation=startRot+(endRot-startRot)*ease;draw();const tick=Math.floor(p*35);if(tick!==lastTick&&p<.97){beep(300+Math.min(700,(1-p)*500));lastTick=tick}if(p<1)requestAnimationFrame(frame);else{rotation=norm(endRot);spinning=false;const winner=items[targetIndex];history.unshift({name:winner.name,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});history=history.slice(0,30);save();render();beep(880,.18);$('resultTitle').textContent=winner.name;$('resultModal').classList.add('show');if($('after').value==='remove'){items.splice(targetIndex,1);save();render()}}}requestAnimationFrame(frame)}
$('spinBtn').onclick=spin;$('closeResult').onclick=()=>$('resultModal').classList.remove('show');$('spinAgain').onclick=()=>{$('resultModal').classList.remove('show');spin()};$('resultModal').onclick=e=>{if(e.target===$('resultModal'))$('resultModal').classList.remove('show')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aev0rn-roulette-backup.json';a.click();URL.revokeObjectURL(url)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!data.items.every(x=>typeof x.name==='string'))throw Error();items=data.items.slice(0,100);history=Array.isArray(data.history)?data.history.slice(0,30):[];save();render();alert('バックアップを読み込みました')}catch{alert('バックアップファイルを読み込めませんでした')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
