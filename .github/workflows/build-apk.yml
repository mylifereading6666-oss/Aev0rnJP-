name: Build Aev0rnJP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug --stacktrace
      - name: Prepare APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aev0rnJP-Roulette.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aev0rnJP-Roulette-APK
          path: Aev0rnJP-Roulette.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Aev0rnJP Roulette APK ${{ github.run_number }}
          make_latest: true
          files: Aev0rnJP-Roulette.apk
